<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Set: sound check</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #07111f; color: #b9cbe0; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 24px 64px; }
      h1 { font-weight: 600; color: #e8eef6; margin: 0 0 16px; }
      h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5fb3ff; margin: 32px 0 12px; }
      button { background: #1d3a5f; color: #e8eef6; border: 1px solid #2f5783; border-radius: 6px; padding: 10px 14px; font: inherit; cursor: pointer; }
      button:hover:not(:disabled) { border-color: #5fb3ff; }
      button:disabled { opacity: 0.6; cursor: default; }
      .start { background: #c9a26b; color: #07111f; border-color: #c9a26b; font-weight: 600; }
      .status { font-size: 14px; opacity: 0.8; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 20px; }
      .sliders { display: grid; gap: 10px; margin-top: 16px; }
      .sliders label { display: grid; grid-template-columns: 80px 1fr 48px; align-items: center; gap: 12px; }
      input[type="range"] { accent-color: #5fb3ff; }
    </style>
  </head>
  <body>
    <main id="audition"></main>
    <script type="module" src="/src/audio/audition.ts"></script>
  </body>
</html>
